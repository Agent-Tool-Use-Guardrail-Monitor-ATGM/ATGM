apiVersion: 1
datasources:
  - name: ATGM (PostgreSQL)
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: analytics_db
      sslmode: disable
      postgresVersion: 1600
