# ATGM platform: Kafka, PostgreSQL (our single database), Grafana.
# First time: cp .env.example .env (and set passwords; .env is git-ignored)
# Start: docker compose up -d
# Stop: docker compose down
# Reset all data: docker compose down -v
# Ports are published on 127.0.0.1 only: on the shared server, reach them through an SSH tunnel (see README).

name: atgm

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./infra/kafka:/init:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: atgm
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: atgm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set it in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atgm_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/visualization/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dspot:
    build: ./services/stream-processing/s09-dspot
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DSPOT_Q: "0.001"
      DSPOT_WARMUP: "500"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-a-adapter:
    build: ./services/agent-a-adapter
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ADAPTER_STATE: /state/adapter.sqlite3
    volumes:
      - agent-a-adapter-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  online-bls:
    build: ./services/stream-processing/s01-online-bls
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ONLINE_BLS_STATE: /state/online-bls.sqlite3
    volumes:
      - online-bls-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  optwin:
    build: ./services/stream-processing/s02-optwin
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      OPTWIN_STATE: /state/optwin.sqlite3
    volumes:
      - optwin-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  online-forest:
    build: ./services/stream-processing/s04-online-forest
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP_ID: online-forest-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  markov-order-check:
    build:
      context: ./services
      dockerfile: stream-processing/s08-markov-order-check/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP_ID: markov-order-check
      MARKOV_ORDER_A: "1"
      MARKOV_ORDER_B: "2"
      MARKOV_RULE: threshold
      MARKOV_CALL_ALERTS_A: "false"
      MARKOV_CALL_ALERTS_B: "true"
      MARKOV_EMPTY_SESSION_A: alert
      MARKOV_EMPTY_SESSION_B: tag
      AGENT_A_DATASET: /data/agent_a/all-events.jsonl
    volumes:
      - ./dataset/agent_a:/data/agent_a:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sliding-top-k:
    build: ./services/stream-processing/s03-sliding-top-k
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPK_K: "3"
      TOPK_SLOT_SECONDS: "30"
      TOPK_UNITS: "20"
      TOPK_EPSILON: "5"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  allow-list:
    build: ./services/stream-processing/s07-allow-list-check
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP_ID: allow-list-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # S05 SpaceSaving± frequent-item summaries (Asmar)
  spacesaving:
    build: ./services/stream-processing/s05-spacesaving
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP_ID: spacesaving-consumer
      TOPICS: tool-calls.A,tool-calls.B,labels
      COUNTER_CAPACITY: "100"
      WINDOW_SECONDS: "60"
      TOP_K: "10"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # S06 KSWIN concept drift detection (Asmar)
  kswin:
    build: ./services/stream-processing/s06-kswin
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP_ID: kswin-consumer
      KAFKA_TOPICS: tool-calls.A,tool-calls.B,scores
      KSWIN_WINDOW_SIZE: "100"
      KSWIN_STAT_SIZE: "30"
      KSWIN_ALPHA: "0.005"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # S10 conformal triage: pass / flag / review
  aci:
    build: ./services/stream-processing/s10-aci
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DETECTORS: mock_scorer,b1_classifier
      ALPHA_NORMAL: "0.05"
      ALPHA_ATTACK: "0.1"
      AUDIT_RATE: "0.3"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  b1-scorer:
    build: ./services/batch-processing/b1-binary-classifier
    command: ["python", "-m", "b1_classifier.scorer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      B1_INPUT_TOPICS: tool-calls.B
      B1_MODELS_DIR: /models
      B1_MODEL_KIND: random_forest
    volumes:
      - b1-models:/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  b1-train:
    build: ./services/batch-processing/b1-binary-classifier
    command: ["python", "-m", "b1_classifier.main",
              "--source", "dataset", "--dataset-dir", "/dataset", "--scenarios", "scenario_01_500.jsonl",
              "--model", "random_forest", "--models-dir", "/models", "--announce"]
    profiles: ["batch"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ANALYTICS_DB: "host=postgres dbname=analytics_db user=analytics_svc password=${SERVICE_DB_PASSWORD:?set it in .env}"
    volumes:
      - b1-models:/models
      - ./dataset/agent_b:/dataset:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  b3-train-a:
    build: ./services/batch-processing/b3-markov-chain
    command: ["python", "-m", "b3_markov.main", "--agent", "A",
              "--dataset-file", "/dataset-a/all-events.jsonl",
              "--exclude-labels", "model_failure",
              "--models-dir", "/models", "--announce"]
    profiles: ["batch"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - b3-models:/models
      - ./dataset/agent_a:/dataset-a:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  b3-train:
    build: ./services/batch-processing/b3-markov-chain
    command: ["python", "-m", "b3_markov.main",
              "--source", "dataset", "--dataset-dir", "/dataset", "--scenarios", "scenario_01_500.jsonl",
              "--smoothing", "additive", "--orders", "1", "2", "--models-dir", "/models", "--announce"]
    profiles: ["batch"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ANALYTICS_DB: "host=postgres dbname=analytics_db user=analytics_svc password=${SERVICE_DB_PASSWORD:?set it in .env}"
    volumes:
      - b3-models:/models
      - ./dataset/agent_b:/dataset:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  b4-retrain:
    build: ./services/batch-processing/b1-binary-classifier
    profiles: ["batch"]
    entrypoint: ["python", "/b4/promote_b1.py", "--source", "db",
                 "--current-champion", "--dataset-dir", "/dataset", "--models-dir", "/models",
                 "--promote", "--announce"]
    command: ["--holdout-scenarios", "b4-holdout.jsonl"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ANALYTICS_DB: "host=postgres dbname=analytics_db user=analytics_svc password=${SERVICE_DB_PASSWORD:?set it in .env}"
    volumes:
      - b1-models:/models
      - ./dataset/agent_b:/dataset:ro
      - ./services/batch-processing/b4-retraining-and-model-registry:/b4:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  review-queue:
    build: ./services/review-queue
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REVIEW_DELAY_SECONDS: "10"
      REVIEWER_ERROR_RATE: "0"
      DB_HOST: postgres
      DB_NAME: scenario_db
      DB_USER: scenario_svc
      DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set it in .env}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  storage-sink:
    build: ./services/storage-sink
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_NAME: analytics_db
      DB_USER: analytics_svc
      DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set it in .env}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Temporary stand-ins until the real agents and detectors publish to Kafka.
  mock-agents:
    build: ./services/mocks
    command: ["python", "-m", "atgm_mocks.run_agents"]
    profiles: ["mocks"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      MOCK_AGENTS: "A,B"
      SESSIONS_PER_SECOND: "5"
      WARMUP_SESSIONS: "1000"
      ATTACK_RATE: "0.05"
      DB_HOST: postgres
      DB_NAME: scenario_db
      DB_USER: scenario_svc
      DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set it in .env}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mock-scorer:
    build: ./services/mocks
    command: ["python", "-m", "atgm_mocks.run_scorer"]
    profiles: ["mocks"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Services in this repository are added here as they are built, e.g.:
  # agent-b:
  #   build: ./services/agent-b
  #   environment:
  #     KAFKA_BOOTSTRAP: kafka:9092
  #     DATABASE_URL: postgresql://agent_b_svc:${SERVICE_DB_PASSWORD}@postgres:5432/agent_b_db
  #   depends_on:
  #     kafka-init:
  #       condition: service_completed_successfully
  # Services in other repositories (e.g. datalens-agent) join the "atgm" network instead.

volumes:
  agent-a-adapter-state:
  online-bls-state:
  optwin-state:
  kafka-data:
  pg-data:
  grafana-data:
  b1-models:
  b3-models:

networks:
  default:
    name: atgm
