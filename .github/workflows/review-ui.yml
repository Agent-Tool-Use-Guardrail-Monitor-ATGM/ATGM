name: Review UI

on:
  pull_request:
    branches: [development, main]
    paths: ["services/review-ui/**", ".github/workflows/review-ui.yml", ".github/workflows/_service.yml"]
  push:
    branches: [development, main]
    paths: ["services/review-ui/**", ".github/workflows/review-ui.yml", ".github/workflows/_service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      path: services/review-ui
      image: atgm-review-ui
