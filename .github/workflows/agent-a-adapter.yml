name: Agent A adapter

on:
  pull_request:
    branches: [development, main]
    paths: ["services/agent-a-adapter/**", ".github/workflows/agent-a-adapter.yml", ".github/workflows/_service.yml"]
  push:
    branches: [development, main]
    paths: ["services/agent-a-adapter/**", ".github/workflows/agent-a-adapter.yml", ".github/workflows/_service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      path: services/agent-a-adapter
      image: atgm-agent-a-adapter
