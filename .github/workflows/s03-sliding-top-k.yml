name: S03 Sliding-window top-k

on:
  pull_request:
    branches: [development, main]
    paths: ["services/stream-processing/s03-sliding-top-k/**", ".github/workflows/s03-sliding-top-k.yml", ".github/workflows/_service.yml"]
  push:
    branches: [development, main]
    paths: ["services/stream-processing/s03-sliding-top-k/**", ".github/workflows/s03-sliding-top-k.yml", ".github/workflows/_service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      path: services/stream-processing/s03-sliding-top-k
      image: atgm-sliding-top-k
      python-version: "3.12"
