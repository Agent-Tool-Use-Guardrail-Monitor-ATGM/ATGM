# Reusable pipeline for one service: lint (warnings only) -> test -> build image -> push to GHCR.
# Each service calls it from its own small workflow file with a path filter, so services
# don't depend on each other. Images are pushed only for pushes to development/main
# (i.e. merged PRs), tagged with the commit SHA and the branch name.
name: service pipeline

on:
  workflow_call:
    inputs:
      path:
        description: service folder, e.g. services/stream-processing/s09-dspot
        type: string
        required: true
      image:
        description: image name without registry, e.g. atgm-dspot
        type: string
        required: true
      python-version:
        type: string
        default: "3.12"
      install:
        description: command that installs the service and its test dependencies
        type: string
        default: pip install -e ".[test]"
      java:
        description: install Java (e.g. for CapyMOA)
        type: boolean
        default: false
      postgres:
        description: start PostgreSQL 16 for the tests (ATGM_TEST_PG is set)
        type: boolean
        default: false
      run-tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    if: inputs.run-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: analytics_db
          POSTGRES_USER: analytics_svc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_svc" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - if: inputs.java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install }}
      - name: Lint (ruff, warnings only)
        continue-on-error: true
        # ruff's findings are shown on the PR as warnings; they never fail the pipeline
        run: |
          pip install --quiet ruff
          ruff check --output-format=github . | sed 's/^::error/::warning/' || true
      - name: Test
        env:
          ATGM_TEST_PG: ${{ inputs.postgres && 'host=localhost port=5432 dbname=analytics_db user=analytics_svc password=ci-only-password' || '' }}
        run: python -m pytest -q

  image:
    needs: test
    # run when tests passed or were not requested
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.path }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
