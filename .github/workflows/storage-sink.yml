name: storage sink

on:
  pull_request:
    branches: [development, main]
    paths: ["services/storage-sink/**", ".github/workflows/storage-sink.yml", ".github/workflows/_service.yml"]
  push:
    branches: [development, main]
    paths: ["services/storage-sink/**", ".github/workflows/storage-sink.yml", ".github/workflows/_service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      path: services/storage-sink
      image: atgm-storage-sink
      postgres: true
