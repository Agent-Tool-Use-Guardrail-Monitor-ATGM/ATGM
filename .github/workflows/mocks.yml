name: mocks

on:
  pull_request:
    branches: [development, main]
    paths: ["services/mocks/**", ".github/workflows/mocks.yml", ".github/workflows/_service.yml"]
  push:
    branches: [development, main]
    paths: ["services/mocks/**", ".github/workflows/mocks.yml", ".github/workflows/_service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      path: services/mocks
      image: atgm-mocks
