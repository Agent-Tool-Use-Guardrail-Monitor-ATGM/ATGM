[project]
name = "review-queue"
version = "0.1.0"
description = "ATGM review queue with a simulated reviewer: answers alarms on the labels topic"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4", "psycopg[binary]>=3.1"]   # only for the running service
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
