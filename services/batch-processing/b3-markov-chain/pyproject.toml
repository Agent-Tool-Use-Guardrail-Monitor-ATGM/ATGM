[project]
name = "b3-markov-chain"
version = "0.1.0"
description = "B3: Markov-chain anomaly detector for agent tool-call sequences (pure Python)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
kafka = ["confluent-kafka>=2.4"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
