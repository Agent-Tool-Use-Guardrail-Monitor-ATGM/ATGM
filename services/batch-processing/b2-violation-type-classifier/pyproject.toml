[project]
name = "b2-violation-type-classifier"
version = "0.1.0"
description = "B2: classify agent sessions by violation type"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
kafka = ["confluent-kafka>=2.4"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
