[project]
name = "agent-a-adapter"
version = "0.1.0"
description = "Translates Agent A (DataLens) telemetry from agent.events.v1 into the ATGM tool-call format on tool-calls.A"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
