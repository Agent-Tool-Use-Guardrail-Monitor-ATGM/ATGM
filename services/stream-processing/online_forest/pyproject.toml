[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "online_forest"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "capymoa==0.11.0",
    "numpy",
    "confluent-kafka",

]

[tool.setuptools.packages.find]
where = ["src"]
include = ["online_forest*"]