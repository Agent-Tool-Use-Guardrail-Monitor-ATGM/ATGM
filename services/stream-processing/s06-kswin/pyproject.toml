[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kswin"
version = "0.1.0"
description = "KSWIN concept drift detection for ATGM numeric features"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
