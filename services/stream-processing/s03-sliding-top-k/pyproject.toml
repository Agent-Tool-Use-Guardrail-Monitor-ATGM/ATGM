[project]
name = "sliding-window-topk"
version = "0.1.0"
description = "P4: sliding-window top-k monitoring of violations per agent (Chen et al., 2017)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]                 
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]