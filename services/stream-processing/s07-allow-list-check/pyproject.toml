[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allow_list"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["allow_list*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
