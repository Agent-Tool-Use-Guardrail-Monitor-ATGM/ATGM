[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markov_order_check"
version = "0.1.0"
description = "S08 Markov order check: real-time tool-call order check against the B3 Markov models"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka",
    "b3-markov-chain",  # services/batch-processing/b3-markov-chain: install it first (pip install -e <path>)
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["markov_order_check*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
