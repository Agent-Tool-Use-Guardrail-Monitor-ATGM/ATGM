[project]
name = "aci"
version = "0.1.0"
description = "Online conformal triage (flag / pass / review) with decaying step sizes (ATGM stream mining)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]        # only for the Kafka service
plot = ["matplotlib>=3.8"]              # only for the evaluation figure
test = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
