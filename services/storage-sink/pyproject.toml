[project]
name = "storage-sink"
version = "0.1.0"
description = "ATGM storage sink: copies Kafka events into PostgreSQL (analytics_db) for Grafana and batch jobs"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
